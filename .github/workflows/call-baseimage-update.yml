name: Check for base image updates
on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * 0'

jobs:
  call-workflow-v3:
    uses: thespad/actions/.github/workflows/check-baseimage-update.yml@v9.1.3
    with:
      repo_owner: ${{ github.repository_owner }}
      baseimage: "alpine"
      basebranch: "3.23"
      app_name: "whisparr"
      prerelease: false
      branch_name: v3
    secrets:
      repo_scoped_token: ${{ secrets.repo_scoped_token }}

  call-workflow-v2:
    uses: thespad/actions/.github/workflows/check-baseimage-update.yml@v9.1.3
    with:
      repo_owner: ${{ github.repository_owner }}
      baseimage: "alpine"
      basebranch: "3.23"
      app_name: "whisparr"
      prerelease: true
      branch_name: v2
    secrets:
      repo_scoped_token: ${{ secrets.repo_scoped_token }}
