name: Build Image On Release

on:
  release:
    types: [ published ]
  pull_request:
  workflow_dispatch:

jobs:
  call-workflow-v3:
    uses: thespad/actions/.github/workflows/build-split-image.yml@v9.1.3
    with:
      repo_owner: thespad
      app_name: "whisparr"
      release_type: "github"
      release_url: "https://api.github.com/repos/Whisparr/Whisparr-Eros"
      dockerhub_user: "thespad"
      target-arch: >-
        ["amd64", "arm64v8"]
      sign_image: false
      branch_name: v3
    secrets:
      dockerhub_password: ${{ secrets.DOCKER_PASSWORD }}
